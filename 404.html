<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0;url=/" />
    <script>
      // For SPA routing on GitHub Pages: when user visits /page, GitHub Pages serves this 404.
      // This script rebuilds the correct location by preserving the pathname and replacing
      // the location with '/#' + pathname if needed, but since we're using BrowserRouter
      // we'll perform a history replace to index.html and then push the pathname.
      (function () {
        var path = window.location.pathname;
        // If we are at the root, just go to index.
        if (path === "/") return;
        // Try to fetch the index.html and then replace the history so BrowserRouter can take over.
        fetch("/index.html").then(function (res) {
          if (res.ok) {
            // Replace the current entry (the 404) with index.html and then navigate to the intended path.
            window.history.replaceState({}, "", "/");
            window.location.replace(path);
          } else {
            // Fallback: navigate to root
            window.location.replace("/");
          }
        }).catch(function () {
          window.location.replace("/");
        });
      })();
    </script>
    <title>Redirecting...</title>
  </head>
  <body>
    Redirecting...
  </body>
</html>
